name: Create site

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Lowercase repository name (letters, digits, single hyphens; max 63)
        required: true
        type: string
      description:
        description: One-line site description (max 350 characters)
        required: false
        type: string
      custom_domain:
        description: Optional hostname under mamachanko.com or maxbrauer.com
        required: false
        type: string
      dry_run:
        description: Validate and show the plan without contacting GitHub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: site-factory-create
  cancel-in-progress: false

jobs:
  create:
    if: github.repository == 'mamachanko/site-factory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY_NAME: ${{ inputs.repository_name }}
      SITE_DESCRIPTION: ${{ inputs.description }}
      CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
      FACTORY_STATE: site-factory-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate and describe the plan
        run: python3 scripts/factory.py plan
      - name: Create installation token
        if: ${{ !inputs.dry_run }}
        id: create-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SITE_FACTORY_APP_ID }}
          private-key: ${{ secrets.SITE_FACTORY_APP_PRIVATE_KEY }}
          owner: mamachanko
          # Omit repositories so the token covers the installation, not just this repo.
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-pages: write
          permission-actions: write
      - name: Create a new public repository
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
        run: python3 scripts/factory.py create --state "$RUNNER_TEMP/$FACTORY_STATE"
      - name: Refresh token after the App gains access to the new repository
        if: ${{ !inputs.dry_run }}
        id: populate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SITE_FACTORY_APP_ID }}
          private-key: ${{ secrets.SITE_FACTORY_APP_PRIVATE_KEY }}
          owner: mamachanko
          repositories: ${{ inputs.repository_name }}
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-pages: write
          permission-actions: write
      - name: Populate repository, configure Pages, and dispatch deployment
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.populate-token.outputs.token }}
        run: python3 scripts/factory.py finish --state "$RUNNER_TEMP/$FACTORY_STATE"
      - name: Report workflow-level failure
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Creation workflow stopped

          Inspect the failed step and any repository created in this run. Token minting and checkout failures can happen outside the factory script. No automatic rollback occurs. Do not add DNS until Settings → Pages confirms the intended custom domain. Rerunning never overwrites an existing repository; see README troubleshooting.
          SUMMARY
