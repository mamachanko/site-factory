name: Initialize site

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Existing public mamachanko repository (lowercase letters, digits, single hyphens; max 63)
        required: true
        type: string
      description:
        description: One-line site description (max 350 characters)
        required: false
        type: string
      custom_domain:
        description: Optional hostname under mamachanko.com or maxbrauer.com
        required: false
        type: string
      dry_run:
        description: Validate and show the plan without contacting GitHub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: site-factory-initialize-${{ inputs.repository_name }}
  cancel-in-progress: false

env:
  REPOSITORY_NAME: ${{ inputs.repository_name }}
  SITE_DESCRIPTION: ${{ inputs.description }}
  CUSTOM_DOMAIN: ${{ inputs.custom_domain }}

jobs:
  plan:
    if: github.repository == 'mamachanko/site-factory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate and describe the plan
        run: python3 scripts/factory.py plan

  initialize:
    needs: plan
    if: ${{ needs.plan.result == 'success' && !inputs.dry_run }}
    environment: site-factory-live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Create target repository token
        id: target-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          app-id: ${{ vars.SITE_FACTORY_APP_ID }}
          private-key: ${{ secrets.SITE_FACTORY_APP_PRIVATE_KEY }}
          owner: mamachanko
          repositories: ${{ inputs.repository_name }}
          permission-administration: write
          permission-contents: write
          permission-workflows: write
          permission-pages: write
          permission-actions: write
      - name: Initialize repository, configure Pages, and dispatch deployment
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: python3 scripts/factory.py initialize
      - name: Report workflow-level failure
        if: failure()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Initialization workflow stopped

          Inspect the failed step and target repository. Token minting and checkout failures can happen outside the factory script. No automatic rollback occurs. Retry with the same factory revision and inputs after inspecting the target. Do not add DNS until Settings → Pages confirms the intended custom domain. See README troubleshooting.
          SUMMARY
